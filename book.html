<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ご予約 | KUNIMARE BREWERY ビヤホール</title>
<meta name="description" content="国稀ブルワリー ビヤホール ご予約フォーム / Kunimare Brewery Beer Hall reservation">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<meta name="theme-color" content="#16293F">
<link rel="stylesheet" href="styles.css">
<style>
  body { background: var(--washi); }
  .bkwrap { max-width: 660px; margin: 0 auto; padding: 34px 18px 70px; }
  .bkhead { text-align: center; margin-bottom: 22px; position: relative; }
  .bkhead img.mark { width: 92px; height: auto; margin-bottom: 10px; }
  .bkhead h1 { font-family: var(--serif); font-size: 24px; letter-spacing: .12em; margin: 0 0 4px; color: var(--indigo-deep); font-weight: 600; }
  .bkhead .sub { color: var(--ink-3); font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase; }
  .bklang { position: absolute; right: 0; top: 0; display: flex; border: 1px solid var(--line-2); border-radius: 3px; overflow: hidden; background: #fff; }
  .bklang button { border: 0; background: transparent; padding: 5px 12px; font-size: 12px; cursor: pointer; color: var(--ink-2); letter-spacing: .08em; }
  .bklang button.on { background: var(--indigo); color: #fff; }
  .bknote { background: #FBF6E7; border: 1px solid #D8C58C; color: #7A5E19; border-radius: 3px; padding: 10px 14px; font-size: 13px; margin-bottom: 18px; }
  .bkcard { background: #fff; border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); padding: 24px 26px 26px; }
  .consent { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; color: var(--ink-2); margin: 16px 0 4px; }
  .consent input { margin-top: 3px; }
  .bksubmit { width: 100%; margin-top: 14px; }
  .bkprog { display: none; text-align: center; padding: 26px 0 6px; color: var(--ink-2); font-size: 14px; }
  .bkprog .sp { width: 34px; height: 34px; border: 3px solid var(--indigo-soft); border-top-color: var(--indigo); border-radius: 50%; margin: 0 auto 12px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bkdone { display: none; text-align: center; padding: 12px 0 4px; }
  .bkdone .okmark { width: 58px; height: 58px; margin: 4px auto 12px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center; }
  .bkdone .no { font-family: var(--serif); font-size: 19px; letter-spacing: .06em; color: var(--indigo-deep); margin: 6px 0 10px; }
  .bkfoot { text-align: center; margin-top: 26px; }
  .bkfoot img { max-width: 300px; width: 70%; opacity: .9; mix-blend-mode: multiply; }
  .bkerr { display: none; background: #FBEFEE; border: 1px solid #DDB3AF; color: #8C3A33; border-radius: 3px; padding: 10px 14px; font-size: 13px; margin-top: 12px; }
  .hp { position: absolute; left: -9999px; top: -9999px; height: 0; overflow: hidden; }
  @media (max-width: 560px) { .bkcard { padding: 18px 16px 20px; } .bklang { position: static; margin: 0 auto 12px; width: max-content; } }
</style>
</head>
<body>
<div class="bkwrap">
  <div class="bkhead">
    <div class="bklang"><button data-l="ja" class="on">日本語</button><button data-l="en">EN</button></div>
    <img class="mark" src="assets/logo.png" alt="KUNIMARE BREWERY">
    <h1 id="hTitle">ビヤホール ご予約</h1>
    <div class="sub">KUNIMARE BREWERY — BEER HALL RESERVATION</div>
  </div>

  <div class="bknote" id="tentNote"></div>

  <div class="bkcard">
    <form id="bkForm" onsubmit="return false">
      <div class="fgrid">
        <div class="field"><label id="lDate"></label><input type="date" id="fDate" required></div>
        <div class="field"><div class="hstack">
          <div><label id="lTime"></label><input type="time" id="fTime" required></div>
          <div><label id="lEnd"></label><input type="time" id="fEnd"></div>
        </div></div>
        <div class="field"><div class="hstack">
          <div><label id="lAdults"></label><input type="number" id="fAdults" min="0" value="2"></div>
          <div><label id="lChildren"></label><input type="number" id="fChildren" min="0" value="0"></div>
        </div></div>
        <div class="field"><label id="lPlan"></label><select id="fPlan"></select>
          <div class="hint"><label class="pill green"><input type="checkbox" id="fNomi"><span id="lNomi"></span></label></div></div>
        <div class="field"><label id="lName"></label><input type="text" id="fName" autocomplete="name"></div>
        <div class="field"><label id="lPhone"></label><input type="text" id="fPhone" inputmode="tel" autocomplete="tel"></div>
        <div class="field"><label id="lEmail"></label><input type="text" id="fEmail" inputmode="email" autocomplete="email"></div>
        <div class="field"><label id="lGroup"></label><input type="text" id="fGroup" autocomplete="organization"></div>
        <div class="field full"><label id="lAllergy"></label><textarea id="fAllergy" style="min-height:60px"></textarea></div>
        <div class="field full"><label id="lNotes"></label><textarea id="fNotes" style="min-height:60px"></textarea></div>
      </div>
      <div class="hp"><label>Website<input type="text" id="fWebsite" tabindex="-1" autocomplete="off"></label></div>
      <label class="consent"><input type="checkbox" id="fConsent"><span id="lConsent"></span></label>
      <button class="btn primary lg bksubmit" id="fSubmit"></button>
      <div class="bkerr" id="bkErr"></div>
    </form>
    <div class="bkprog" id="bkProg"><div class="sp"></div><div id="bkProgTxt"></div></div>
    <div class="bkdone" id="bkDone">
      <div class="okmark">✓</div>
      <div id="doneMsg"></div>
      <div class="no" id="doneNo"></div>
      <a class="btn ind" id="donePdf" download>▼ PDF</a>
      <div class="hint" id="doneHint" style="margin-top:12px"></div>
    </div>
  </div>

  <div class="bkfoot"><img src="assets/footer.png" alt="国稀酒造株式会社"></div>
</div>
<script src="vendor/pdf-lib.min.js"></script>
<script type="module" src="book.js"></script>
</body>
</html>
